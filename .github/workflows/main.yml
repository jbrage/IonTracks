name: tests

on:
  push:
    branches: [master, v4]
    tags: ["*"]
  pull_request:
    branches: [master, v4]
  release:
    types: [published]

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests examples validation report
          ruff format --check src tests examples validation report

      - name: Tests
        run: python -m pytest

      - name: Examples
        run: |
          python examples/scanned_field.py
          python examples/cyclotron_250MeV.py

  validation:
    # regenerates the validation report and both benchmarks; fails if a validation check fails
    name: validation (ubuntu / Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install package with plot extras
        run: python -m pip install -e ".[plot]"

      - name: Validation checks
        run: |
          python validation/run_validation.py
          python validation/validate_tile3d.py

      - name: Benchmarks
        run: |
          python validation/benchmark_dcpt2019.py
          python validation/benchmark_risoe2026.py
