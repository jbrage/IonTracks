[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "iontracks"
version = "4.0.0.dev0"
description = "Ion recombination in parallel-plate ionization chambers for beams with arbitrary time structure"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Jeppe Brage Christensen", email = "jeppebrage@gmail.com" }]
dependencies = ["numpy>=1.24", "numba>=0.59"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Code = "https://github.com/ion-tracks/IonTracks-Cython"
Issues = "https://github.com/ion-tracks/IonTracks-Cython/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.ruff.lint.per-file-ignores]
"validation/*" = ["E501"]  # long axis labels and captions
"report/*" = ["E501"]
